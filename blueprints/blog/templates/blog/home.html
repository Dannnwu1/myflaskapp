<!-- blueprints/blog/templates/blog/index.html -->
{% extends "base.html" %}

{% block title %}Blog - {{ super() }}{% endblock %}

{% block content %}
<h1>Blog Posts</h1>
<ul>
    {% for post in posts %}
    <li>
        <h3><a href="{{ url_for('blog.show_post', post_id=post.id) }}">{{ post.title }}</a></h3>
        <p>{{ post.content[:100] }}...</p>
    </li>
    {% endfor %}
</ul>
<a href="{{ url_for('blog.create_post') }}" class="btn btn-primary">Create New Post</a>
{% endblock %}
