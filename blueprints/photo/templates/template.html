<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Photo Gallery</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #6c63ff;
            --secondary-color: #f8f9fa;
            --dark-color: #343a40;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-top: 20px;
            background-color: #f9f9f9;
        }

        .gallery-header {
            background: linear-gradient(135deg, var(--primary-color), #4a44c8);
            color: white;
            padding: 2.5rem 0;
            border-radius: 10px;
            margin-bottom: 2rem;
            box-shadow: 0 5px 15px rgba(108, 99, 255, 0.2);
        }

        .gallery-title {
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .gallery-subtitle {
            opacity: 0.9;
            font-weight: 300;
        }

        .filter-btn {
            margin: 0 5px 10px;
            border-radius: 30px;
            padding: 8px 20px;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--primary-color);
            color: white;
            transform: translateY(-2px);
        }

        .gallery-item {
            margin-bottom: 1.5rem;
            transition: transform 0.3s ease;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: white;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .img-caption {
            padding: 15px;
            background-color: white;
        }

        .img-caption h5 {
            font-size: 1rem;
            margin-bottom: 5px;
            color: var(--dark-color);
        }

        .img-caption p {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 0;
        }

        .lightbox-img {
            width: 100%;
            border-radius: 8px;
        }

        .layout-btn {
            padding: 8px 12px;
            border-radius: 5px;
            margin-left: 5px;
        }

        .layout-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .gallery-container.grid-view .gallery-item {
            height: auto;
        }

        .gallery-container.masonry-view .gallery-item {
            break-inside: avoid;
        }

        .masonry-container {
            column-count: 3;
            column-gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .masonry-container {
                column-count: 2;
            }
        }

        @media (max-width: 576px) {
            .masonry-container {
                column-count: 1;
            }

            .filter-btn {
                margin-bottom: 8px;
            }
        }

        footer {
            margin-top: 3rem;
            padding: 1.5rem 0;
            background-color: var(--dark-color);
            color: white;
            border-radius: 10px 10px 0 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Gallery Header -->
        <div class="gallery-header text-center">
            <h1 class="gallery-title"><i class="bi bi-images"></i> Photo Gallery</h1>
            <p class="gallery-subtitle">A responsive image gallery built with Bootstrap 5</p>
        </div>

        <!-- Gallery Controls -->
        <div class="row mb-4">
            <div class="col-md-8">
                <div class="d-flex flex-wrap">
                    <button class="btn btn-outline-primary filter-btn active" data-filter="all">All Photos</button>
                    <button class="btn btn-outline-primary filter-btn" data-filter="nature">Nature</button>
                    <button class="btn btn-outline-primary filter-btn" data-filter="city">City</button>
                    <button class="btn btn-outline-primary filter-btn" data-filter="travel">Travel</button>
                    <button class="btn btn-outline-primary filter-btn" data-filter="portrait">Portrait</button>
                </div>
            </div>
            <div class="col-md-4 text-md-end">
                <div class="btn-group" role="group">
                    <span class="align-self-center me-2 d-none d-md-inline">Layout:</span>
                    <button type="button" class="btn btn-outline-secondary layout-btn active" data-layout="grid">
                        <i class="bi bi-grid-3x3-gap"></i> Grid
                    </button>
                    <button type="button" class="btn btn-outline-secondary layout-btn" data-layout="masonry">
                        <i class="bi bi-columns-gap"></i> Masonry
                    </button>
                </div>
            </div>
        </div>

        <!-- Gallery Images -->
        <div class="gallery-container grid-view" id="gallery-container">
            <div class="row" id="gallery-grid">
                <!-- Images will be dynamically inserted here -->
            </div>
        </div>

        <!-- Footer -->
        <footer class="text-center">
            <p class="mb-2">Bootstrap Photo Gallery &copy; 2023</p>
            <p class="mb-0 text-light">Built with <i class="bi bi-heart-fill text-danger"></i> and Bootstrap 5</p>
        </footer>
    </div>

    <!-- Lightbox Modal -->
    <div class="modal fade" id="lightboxModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="lightboxTitle">Image Title</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <img src="" alt="" class="lightbox-img" id="lightboxImage">
                    <p class="mt-3" id="lightboxDescription"></p>
                </div>
                <div class="modal-footer justify-content-between">
                    <div>
                        <span id="lightboxCategory" class="badge bg-primary"></span>
                        <span id="lightboxDate" class="text-muted ms-2"></span>
                    </div>
                    <div>
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
                        <a href="#" class="btn btn-primary" id="downloadBtn" download>
                            <i class="bi bi-download"></i> Download
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Gallery data
        const galleryData = [
            {
                id: 1,
                title: "Mountain Landscape",
                category: "nature",
                description: "Beautiful mountain view with clear sky and green fields.",
                date: "April 15, 2023",
                imgSrc: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 2,
                title: "City Skyline at Night",
                category: "city",
                description: "Modern city skyline illuminated at night with colorful lights.",
                date: "May 3, 2023",
                imgSrc: "https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 3,
                title: "Beach Vacation",
                category: "travel",
                description: "Tropical beach with white sand and palm trees.",
                date: "June 22, 2023",
                imgSrc: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 4,
                title: "Portrait in Sunlight",
                category: "portrait",
                description: "Woman portrait with natural sunlight creating beautiful shadows.",
                date: "July 10, 2023",
                imgSrc: "https://images.unsplash.com/photo-1494790108755-2616b612b786?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w-600&q=80"
            },
            {
                id: 5,
                title: "Forest Path",
                category: "nature",
                description: "Peaceful forest path surrounded by tall trees and greenery.",
                date: "August 5, 2023",
                imgSrc: "https://images.unsplash.com/photo-1448375240586-882707db888b?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 6,
                title: "Urban Architecture",
                category: "city",
                description: "Modern architectural building with geometric design.",
                date: "September 12, 2023",
                imgSrc: "https://images.unsplash.com/photo-1487958449943-2429e8be8625?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 7,
                title: "Desert Adventure",
                category: "travel",
                description: "Vast desert landscape with sand dunes under blue sky.",
                date: "October 3, 2023",
                imgSrc: "https://images.unsplash.com/photo-1505118380757-91f5f5632de0?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 8,
                title: "Creative Portrait",
                category: "portrait",
                description: "Creative portrait with unique lighting and composition.",
                date: "November 18, 2023",
                imgSrc: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 9,
                title: "Waterfall in Mountains",
                category: "nature",
                description: "Majestic waterfall cascading down rocky mountains.",
                date: "December 5, 2023",
                imgSrc: "https://images.unsplash.com/photo-1512273222628-4daea6e55abb?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 10,
                title: "City Street Life",
                category: "city",
                description: "Busy city street with pedestrians and urban atmosphere.",
                date: "January 14, 2024",
                imgSrc: "https://images.unsplash.com/photo-1449824913935-59a10b8d2000?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 11,
                title: "Mountain Hiking",
                category: "travel",
                description: "Hiking trail in the mountains with breathtaking views.",
                date: "February 8, 2024",
                imgSrc: "https://images.unsplash.com/photo-1551632811-561732d1e306?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 12,
                title: "Studio Portrait",
                category: "portrait",
                description: "Professional studio portrait with controlled lighting.",
                date: "March 21, 2024",
                imgSrc: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80"
            }
        ];

        // Initialize gallery
        document.addEventListener('DOMContentLoaded', function() {
            const galleryContainer = document.getElementById('gallery-grid');

            // Render gallery items
            function renderGallery(items) {
                galleryContainer.innerHTML = '';

                items.forEach(item => {
                    const col = document.createElement('div');
                    col.className = 'col-md-4 col-lg-3 gallery-col';
                    col.setAttribute('data-category', item.category);

                    col.innerHTML = `
                        <div class="gallery-item" data-id="${item.id}">
                            <img src="${item.imgSrc}" class="img-fluid" alt="${item.title}">
                            <div class="img-caption">
                                <h5>${item.title}</h5>
                                <p><span class="badge bg-secondary">${item.category}</span> • ${item.date}</p>
                            </div>
                        </div>
                    `;

                    galleryContainer.appendChild(col);
                });

                // Add click event to gallery items
                document.querySelectorAll('.gallery-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const id = parseInt(this.getAttribute('data-id'));
                        const galleryItem = galleryData.find(item => item.id === id);
                        openLightbox(galleryItem);
                    });
                });
            }

            // Initialize with all items
            renderGallery(galleryData);

            // Filter functionality
            document.querySelectorAll('.filter-btn').forEach(button => {
                button.addEventListener('click', function() {
                    // Update active button
                    document.querySelectorAll('.filter-btn').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    this.classList.add('active');

                    const filter = this.getAttribute('data-filter');

                    if (filter === 'all') {
                        renderGallery(galleryData);
                    } else {
                        const filteredItems = galleryData.filter(item => item.category === filter);
                        renderGallery(filteredItems);
                    }
                });
            });

            // Layout toggle functionality
            document.querySelectorAll('.layout-btn').forEach(button => {
                button.addEventListener('click', function() {
                    // Update active button
                    document.querySelectorAll('.layout-btn').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    this.classList.add('active');

                    const layout = this.getAttribute('data-layout');
                    const container = document.getElementById('gallery-container');
                    const galleryGrid = document.getElementById('gallery-grid');

                    if (layout === 'grid') {
                        container.className = 'gallery-container grid-view';
                        galleryGrid.className = 'row';
                    } else {
                        container.className = 'gallery-container masonry-view';
                        galleryGrid.className = 'masonry-container';

                        // Re-render for masonry layout
                        const currentFilter = document.querySelector('.filter-btn.active').getAttribute('data-filter');
                        let currentItems = galleryData;

                        if (currentFilter !== 'all') {
                            currentItems = galleryData.filter(item => item.category === currentFilter);
                        }

                        renderGallery(currentItems);
                    }
                });
            });

            // Lightbox functionality
            function openLightbox(item) {
                document.getElementById('lightboxTitle').textContent = item.title;
                document.getElementById('lightboxImage').src = item.imgSrc;
                document.getElementById('lightboxImage').alt = item.title;
                document.getElementById('lightboxDescription').textContent = item.description;
                document.getElementById('lightboxCategory').textContent = item.category;
                document.getElementById('lightboxDate').textContent = item.date;
                document.getElementById('downloadBtn').href = item.imgSrc;

                const lightboxModal = new bootstrap.Modal(document.getElementById('lightboxModal'));
                lightboxModal.show();
            }
        });
    </script>
</body>
</html>
